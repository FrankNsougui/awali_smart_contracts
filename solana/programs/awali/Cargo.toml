[package]
name = "awali"
version = "0.1.0"
description = "Awali multi-chain liquidity protocol — Solana program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "awali"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"
# Pin to edition 2021 compatible versions (SBF toolchain has Cargo 1.79)